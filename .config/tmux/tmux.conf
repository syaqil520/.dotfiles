# ============================================================
# General behavior
# ============================================================
set -g mouse on
set-option -g focus-events on
set -g set-clipboard on
set -g detach-on-destroy off # don't exit from tmux when closing a session

# remove delay for exiting insert mode with ESC in Neovim
set -sg escape-time 0

# increase scrollback buffer size
set-option -g history-limit 50000
set-option -g display-time 4000 # tmux messages are displayed for 4 seconds
set-option -g status-keys emacs
set-window-option -g aggressive-resize on

# Start window and panes at 1
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on
set-window-option -g mode-keys vi

# ============================================================
# Terminal / display
# ============================================================
set-option -g default-terminal "screen-256color"
set -s extended-keys on
set -as terminal-features 'xterm-kitty:extkeys'

# for real-icon plugin nvim
set -g allow-passthrough on

# ============================================================
# Keybindings
# ============================================================

# replace prefix
unbind C-x
set -g prefix C-x
bind C-x send-prefix

# pane/window management
unbind |
bind | split-window -h -c "#{pane_current_path}"
unbind -
bind - split-window -v -c "#{pane_current_path}"
# bind j resize-pane -D 5
# bind k resize-pane -U 5
# bind l resize-pane -R 5
# bind h resize-pane -L 5
bind -r l select-pane -R  # move right
bind > swap-pane -D       # swap current pane with the next one
bind < swap-pane -U       # swap current pane with the previous one
bind -r m resize-pane -Z
# Shift arrow to switch windows
bind -n S-Left previous-window
bind -n S-Right next-window
bind-key x kill-pane # skip "kill-pane 1? (y/n)" prompt
bind-key r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"

# Sesh
bind-key "K" run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux --layout=reverse -p 80%,70% --no-border \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""

# FZF Tmux
TMUX_FZF_LAUNCH_KEY="C-f"
TMUX_FZF_OPTIONS="-p -w 62% -h 38% -m --layout=reverse"

# ============================================================
# Theme / colors
# ============================================================
set -g status-position top

# nvchad onedark base_30 palette (only the colors status bar actually uses)
set -ogq @nvchad_white "#abb2bf"
set -ogq @nvchad_red "#e06c75"
set -ogq @nvchad_baby_pink "#DE8C92"
set -ogq @nvchad_pink "#ff75a0"
set -ogq @nvchad_green "#98c379"
set -ogq @nvchad_yellow "#e7c787"
set -ogq @nvchad_teal "#519ABA"
set -ogq @nvchad_blue "#61afef"
set -ogq @nvchad_grey_fg2 "#6f737b"
set -ogq @nvchad_statusline_bg "#22262e"
set -ogq @nvchad_text "#1e222a"

# status left look and feel
set -g status-left-length 100
set -g status-left ""
set -ga status-left "#{?client_prefix,#{#[bg=#{@nvchad_red},fg=#{@nvchad_text},bold]  #S },#{#[bg=#{@nvchad_blue},fg=#{@nvchad_text},bold]  #S }}"
set -ga status-left "#[bg=#{@nvchad_statusline_bg},fg=#{@nvchad_baby_pink}]  #{pane_current_command} "
set -ga status-left "#[bg=#{@nvchad_statusline_bg},fg=#{@nvchad_grey_fg2},none]│"
set -ga status-left "#[bg=#{@nvchad_statusline_bg},fg=#{@nvchad_green}]  #{=/-32/...:#{s|$USER|~|:#{b:pane_current_path}}} "
set -ga status-left "#[bg=#{@nvchad_statusline_bg},fg=#{@nvchad_grey_fg2},none]#{?window_zoomed_flag,│,}"
set -ga status-left "#[bg=#{@nvchad_statusline_bg},fg=#{@nvchad_yellow}]#{?window_zoomed_flag,  zoom ,}"

# status right look and feel
set -g status-right-length 100
set -g status-right ""
set -ga status-right "#[bg=default,fg=#{@nvchad_baby_pink},bold] 󰍛 #{cpu_percentage} "
set -ga status-right "#[bg=#{@nvchad_statusline_bg},fg=#{@nvchad_grey_fg2}, none]│"
set -ga status-right "#[bg=default,fg=#{@nvchad_teal},bold]  #{ram_percentage} "
set -ga status-right "#[bg=#{@nvchad_statusline_bg},fg=#{@nvchad_grey_fg2}, none]│"
set -ga status-right "#[bg=default,fg=#{@nvchad_teal},bold]  #{user} "

set -g status-style "bg=#{@nvchad_statusline_bg}"
set -g status-justify "absolute-centre"

# pane border look and feel
# setw -g pane-border-status top
# setw -g pane-border-format ""
# setw -g pane-active-border-style "bg=#{@nvchad_statusline_bg},fg=#{@nvchad_grey_fg2}"
# setw -g pane-border-style "bg=#{@nvchad_statusline_bg},fg=#{@nvchad_grey_fg2}"
# setw -g pane-border-lines single

# window look and feel
set -wg automatic-rename on
set -g automatic-rename-format "Window"

setw -g mode-style 'fg=black bg=#d96068 bold'

set -g window-status-format " #I#{?#{!=:#{window_name},Window},: #W,} "
set -g window-status-style "bg=#{@nvchad_statusline_bg},fg=#{@nvchad_white}"
set -g window-status-last-style "bg=#{@nvchad_statusline_bg},fg=#{@nvchad_white}"
set -g window-status-activity-style "bg=#{@nvchad_red},fg=#{@nvchad_statusline_bg}"
set -g window-status-bell-style "bg=#{@nvchad_red},fg=#{@nvchad_statusline_bg},bold"
set -gF window-status-separator "#[bg=#{@nvchad_statusline_bg},fg=#{@nvchad_grey_fg2}]│"

set -g window-status-current-format " #I#{?#{!=:#{window_name},Window},: #W,} "
set -g window-status-current-style "bg=#{@nvchad_pink},fg=#{@nvchad_statusline_bg},bold"

# ============================================================
# Plugins
# ============================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions for you every 15 minutes
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'omerxx/tmux-floax'

set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'

# need to be at bottom!!!
run '~/.tmux/plugins/tpm/tpm'
